workflows:
  ios-release:
    name: Hawkar iOS Release IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter packages pub get
      - name: Build iOS Application (Release)
        script: |
          flutter build ios --release --no-codesign --no-tree-shake-icons
      - name: Package into IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q Hawkar.ipa Payload
    artifacts:
      - Hawkar.ipa
      - build/ios/iphoneos/Runner.app
      - "*.ipa"
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          failure: true
          success: true
